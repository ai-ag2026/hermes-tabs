name: hermes-tabs
version: "0.4.1"
description: "Hermes in the browser - settings: master switch, safety level and switches (read only to full access), default for all websites (ask / allow all), time window, allowed and blocked sites. The values live in the browser extension and apply there; loosening must be confirmed in the browser. This plugin shows them under Settings -> Plugins and can optionally (opt-in) enforce blocked sites for Hermes' own browser tools too."
author: "ai-ag2026"
license: MIT
requires_hermes: ">=0.22.5"
requires_env:
  - name: HERMES_TABS_ADMIN_TOKEN
    description: "Admin token of the hermes-tabs relay (HERMES_TABS_ADMIN_TOKEN in the relay's env file)"
    url: "https://github.com/ai-ag2026/hermes-tabs#hermes-plugin"
    password: true
provides_hooks:
  - pre_tool_call

<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Hermes Tabs</title>
<style>
  /* Hermes desktop default theme ("nous"), light and dark, resolved to fixed values. */
  :root {
    --bg: #f8f9fe; --surface: #fdfdfd; --text: #242528; --text-2: #515255; --text-3: #7e7f83;
    --stroke: #d5dff4; --stroke-strong: #c3d1f0; --accent: #0053fd; --on-accent: #fff;
    --ctl: #e8edf6; --ctl-hover: #d9e2f3; --row-hover: #f1f4fb;
    --radius: 3px; --radius-card: 5px;
    font: 13px/1.45 "Segoe WPC", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1015; --surface: #16181c; --text: #d9e0e6; --text-2: #aeb4b9; --text-3: #82878d;
      --stroke: #252c3c; --stroke-strong: #2b364d; --accent: #4a84fe; --on-accent: #161616;
      --ctl: #242a38; --ctl-hover: #303b52; --row-hover: #1e222b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
  header { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.5rem; }
  header img { display: block; width: 32px; height: 32px; border-radius: 7px; box-shadow: 0 0 0 1px var(--stroke-strong); }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
  #version { color: var(--text-3); }
  section { margin-bottom: 1.5rem; }
  h2 { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); margin: 0 0 .5rem; }
  .card { background: var(--surface); border: 1px solid var(--stroke); border-radius: var(--radius-card); }
  .row { display: flex; align-items: center; gap: 1rem; padding: .75rem 1rem; border-top: 1px solid var(--stroke); }
  .row:first-child { border-top: 0; }
  .row.stack { display: block; }
  .row > div:first-child { flex: 1; min-width: 0; }
  .title { font-weight: 500; }
  .desc { color: var(--text-2); font-size: .75rem; margin-top: .125rem; }
  .ctl { flex: none; display: flex; flex-wrap: wrap; gap: .375rem; justify-content: flex-end; max-width: 60%; }
  input:not([type=radio], [type=checkbox]) {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--stroke-strong); border-radius: var(--radius);
    padding: .3rem .5rem; width: 18rem; max-width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; flex: none; }
  label.row { cursor: pointer; }
  label.row:hover { background: var(--row-hover); }
  button { font: inherit; font-weight: 500; color: var(--text); background: var(--ctl); border: 0; border-radius: var(--radius);
           padding: .3rem .75rem; cursor: pointer; }
  button:hover { background: var(--ctl-hover); }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.primary:hover { filter: brightness(1.08); }
  #status { color: var(--text-2); font-size: .75rem; }
  ul { list-style: none; margin: .5rem 0 0; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .25rem 0; }
  li span { overflow-wrap: anywhere; }
  li.none { color: var(--text-3); }
  .add { display: flex; gap: .375rem; margin-top: .5rem; }
  /* Switch: a checkbox drawn as a pill */
  .switch { appearance: none; flex: none; width: 32px; height: 18px; margin: 0; border-radius: 9px; background: var(--stroke-strong);
            position: relative; cursor: pointer; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 14px; height: 14px; border-radius: 50%;
                   background: #fff; transition: inset-inline-start .15s; }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { inset-inline-start: 16px; }
  @media (max-width: 34rem) {
    .row:not(label) { flex-direction: column; align-items: stretch; }
    .ctl { justify-content: flex-start; max-width: none; }
    input:not([type=radio], [type=checkbox]) { width: 100%; }
  }
</style>
<main>
  <header>
    <picture><source srcset="icon48-dark.png" media="(prefers-color-scheme: dark)"><img src="icon48.png" alt=""></picture>
    <h1>Hermes Tabs</h1><span id="version"></span>
  </header>

  <section>
    <h2 data-i18n="optConnectionHeading"></h2>
    <div class="card">
      <div class="row"><div><label class="title" for="relay">Relay</label><div class="desc" data-i18n="optRelayHelp"></div></div>
        <div class="ctl"><input id="relay" placeholder="ws://127.0.0.1:8766/ext" dir="ltr"></div></div>
      <div class="row"><div><label class="title" for="token">Token</label><div class="desc" data-i18n="optTokenHelp"></div></div>
        <div class="ctl"><input id="token" type="password" dir="ltr"></div></div>
      <div class="row"><div><label class="title" for="browserName" data-i18n="optBrowserName"></label><div class="desc" data-i18n="optBrowserNameHelp"></div></div>
        <div class="ctl"><input id="browserName" maxlength="60"></div></div>
      <div class="row"><div id="status"></div><div class="ctl"><button id="save" class="primary" data-i18n="optSave"></button></div></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="optBrowserHeading"></h2>
    <div class="card">
      <label class="row"><div class="title" data-i18n="optEnabled"></div><input type="checkbox" id="enabled" class="switch"></label>
    </div>
  </section>

  <section>
    <h2 data-i18n="optActionsHeading"></h2>
    <div class="card">
      <div class="row"><div class="desc" data-i18n="optActionsHelp"></div></div>
      <label class="row"><div class="title" data-i18n="optModeAsk"></div><input type="radio" name="mode" value="ask"></label>
      <label class="row"><div class="title" data-i18n="optModeAll"></div><input type="radio" name="mode" value="all"></label>
      <div class="row"><div><div class="title" data-i18n="optTempHeading"></div><div class="desc" id="temp"></div></div>
        <div class="ctl"><button data-t="all1h" data-i18n="opt1h"></button><button data-t="all8h" data-i18n="opt8h"></button><button data-t="allSession" data-i18n="optUntilRestart"></button><button data-t="off" data-i18n="optEnd"></button></div></div>
      <div class="row stack"><div class="title" data-i18n="optAlwaysHeading"></div><ul id="sites"></ul></div>
      <div class="row stack"><div class="title" data-i18n="optSessionHeading"></div><ul id="sessionSites"></ul></div>
    </div>
  </section>

  <section>
    <h2 data-i18n="optBlockedHeading"></h2>
    <div class="card">
      <div class="row stack"><div class="desc" data-i18n="optBlockedHelp"></div><ul id="blocked"></ul>
        <div class="add"><input id="blockNew" placeholder="example.com" dir="ltr"><button id="blockAdd" data-i18n="optAdd"></button></div></div>
    </div>
  </section>
</main>
<script src="options.js"></script>
